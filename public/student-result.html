<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Results · Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script src="./auth.check.js"></script>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">
            <img src="/assets/logo.png" alt="QA" />
          </span>
          Quiz App
        </div>
        <nav class="sidebar-nav">
          <a href="student-dashboard.html" id="navMyQuizzes" class=""
            >My quizzes</a
          >
          <a href="student-dashboard.html" id="navMyQuizzes" class="active"
            >Quiz Results</a
          >
        </nav>
        <div class="sidebar-footer">
          <div class="sidebar-user-avatar" id="userAvatar">AS</div>
          <div class="sidebar-user-meta">
            <span class="name" id="studentName">Aarav Shah</span>
            <span class="role-tag" id="role">Student</span>
          </div>
          <button id="logoutBtnStudent">Log out</button>
        </div>
      </aside>

      <main class="main-area">
        <div class="main-header">
          <div>
            <span class="eyebrow">Results</span>
            <h2>Your quiz results</h2>
          </div>
          <button type="button" class="btn btn-primary" id="backToDashboardBtn">
            Back to my quizzes
          </button>
        </div>

        <div class="summary-stats" id="summaryStats"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Quiz</th>
                <th>Date</th>
                <th>Score</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="quizTableBody">
              <tr>
                <td colspan="4">
                  <div class="empty-state">
                    <p>Loading your results…</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="quizModalOverlay">
      <div class="modal-box modal-box-lg">
        <span class="eyebrow" id="modalEyebrow">Cell Biology — Unit 3</span>
        <h3 id="modalTitle">Quiz complete</h3>
        <p id="modalResultStatusNote">Submitted with 2 minutes remaining.</p>

        <div class="score-ring">
          <svg viewBox="0 0 150 150">
            <circle class="track" cx="75" cy="75" r="59"></circle>
            <circle id="scoreProgressCircle" cx="75" cy="75" r="59"></circle>
          </svg>
          <div class="score-ring-label">
            <p id="scoreDisplay">9</p>
            <p id="scoreOutOf">out of 12</p>
          </div>
        </div>

        <div id="answerReview" class="review-list"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="modalCloseBtn">
            Close
          </button>
        </div>
      </div>
    </div>
    <div id="logoutModalOverlay" class="modal-overlay">
      <div class="modal-box">
        <h3>Confirm Logout</h3>
        <p></p>
        <div class="modal-actions">
          <button
            type="button"
            id="cancelLogoutBtn"
            class="btn btn-ghost btn-sm"
          >
            Cancel
          </button>
          <button
            type="button"
            id="confirmLogoutBtn"
            class="btn btn-danger-ghost btn-sm"
          >
            Logout
          </button>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "/api";
      const RESULTS_ENDPOINT = `${API_BASE}/student/myResults`;
      const ATTEMPT_ENDPOINT = `${API_BASE}/student/thisResponse`;

      const circleCircumference = 370;

      const userName = document.getElementById("studentName");
      const role = document.getElementById("role");
      const userAvatar = document.getElementById("userAvatar");
      loadName();

      const quizTableBody = document.getElementById("quizTableBody");
      const summaryStats = document.getElementById("summaryStats");
      const quizModalOverlay = document.getElementById("quizModalOverlay");
      const modalCloseBtn = document.getElementById("modalCloseBtn");

      let quizzes = [];
      let metaData = { totalQuizTaken: 0, avgScore: 0, bestScore: 0 };
      let lastFocusedRow = null;

      function getToken() {
        return localStorage.getItem("token");
      }

      function authHeaders() {
        const token = getToken();
        return token ? { Authorization: `Bearer ${token}` } : {};
      }

      function formatDate(dateStr) {
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        return d.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      async function fetchResults() {
        try {
          const res = await fetch(RESULTS_ENDPOINT, { headers: authHeaders() });
          if (!res.ok)
            throw new Error(`Failed to fetch results (${res.status})`);
          const payload = await res.json();

          quizzes = payload.results;
          quizzes.sort((a, b) => new Date(b.date) - new Date(a.date));

          metaData = payload.metaData;

          renderStats();
          renderTable();
        } catch (err) {
          console.error(err);
          quizTableBody.innerHTML = `
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <p>Couldn't load your results. Please try again.</p>
                </div>
              </td>
            </tr>
          `;
        }
      }

      async function fetchAttemptReview(attemptId) {
        const res = await fetch("/api/student/thisResponse", {
          method: "PUT",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify({ attemptToken: attemptId }),
        });
        if (!res.ok)
          throw new Error(`Failed to fetch attempt review (${res.status})`);
        const payload = await res.json();
        return payload.data;
      }

      function renderStats() {
        if (quizzes.length === 0) {
          summaryStats.innerHTML = "";
          return;
        }

        summaryStats.innerHTML = `
          <div class="stat-card">
            <div class="stat-value">${metaData.totalQuizTaken}</div>
            <div class="stat-label">Quizzes Taken</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${metaData.avgScore}%</div>
            <div class="stat-label">Average Score</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${metaData.bestScore}%</div>
            <div class="stat-label">Best Score</div>
          </div>
        `;
      }

      function renderTable() {
        if (quizzes.length === 0) {
          quizTableBody.innerHTML = `
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <div class="empty-icon">—</div>
                  <p>You haven't attempted any quizzes yet.</p>
                </div>
              </td>
            </tr>
          `;
          return;
        }

        quizTableBody.innerHTML = "";

        quizzes.forEach((quiz) => {
          const badgeClass = quiz.passeed ? "badge-done" : "badge-missed";
          const badgeText = quiz.passeed ? "Passed" : "Failed";

          const row = document.createElement("tr");
          row.style.cursor = "pointer";
          row.tabIndex = 0;
          row.setAttribute("role", "button");
          row.setAttribute(
            "aria-label",
            `View details for ${quiz.quizTitle}, scored ${quiz.score} out of ${quiz.total}`,
          );
          row.innerHTML = `
            <td>${quiz.quizTitle}</td>
            <td>${formatDate(quiz.date)}</td>
            <td class="score-cell">${quiz.score} / ${quiz.total} (${quiz.percentage}%)</td>
            <td><span class="badge ${badgeClass}">${badgeText}</span></td>
          `;
          row.addEventListener("click", () => openModal(quiz, row));
          row.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openModal(quiz, row);
            }
          });
          quizTableBody.appendChild(row);
        });
      }

      async function openModal(quiz, triggerRow) {
        lastFocusedRow = triggerRow || null;

        const fraction = quiz.total ? quiz.score / quiz.total : 0;
        const dashoffset = circleCircumference * (1 - fraction);

        document.getElementById("modalEyebrow").textContent = quiz.quizTitle;
        document.getElementById("modalTitle").textContent = "Quiz complete";
        document.getElementById("modalResultStatusNote").textContent =
          quiz.passeed ? "You passed this quiz." : "You didn't pass this quiz.";
        document.getElementById("scoreDisplay").textContent = quiz.score;
        document.getElementById("scoreOutOf").textContent =
          `out of ${quiz.total}`;
        document.getElementById("scoreProgressCircle").style.strokeDashoffset =
          dashoffset;

        const reviewContainer = document.getElementById("answerReview");
        reviewContainer.innerHTML = `<p class="empty-state">Loading answers…</p>`;

        quizModalOverlay.classList.add("show");
        modalCloseBtn.focus();

        try {
          const questions = await fetchAttemptReview(quiz.attmptId);
          reviewContainer.innerHTML = "";

          questions.forEach((item) => {
            const isCorrect = item.selectedId === item.correctId;
            const reviewItem = document.createElement("div");
            reviewItem.className = `review-item ${isCorrect ? "correct" : "incorrect"}`;

            if (isCorrect) {
              reviewItem.innerHTML = `
                <p class="review-question">${item.questionText}</p>
                <div class="review-answer-row">
                  <span class="review-status-icon">✓</span>
                  <span class="reviewYourAnswer">Your answer: ${item.selectedText ?? "No answer"}</span>
                </div>
              `;
            } else {
              reviewItem.innerHTML = `
                <p class="review-question">${item.questionText}</p>
                <div class="review-answer-row">
                  <span class="review-status-icon">✕</span>
                  <span class="reviewYourAnswer">Your answer: ${item.selectedText ?? "No answer"}</span>
                </div>
                <div class="review-answer-row">
                  <span class="reviewCorrectAnswer">Correct answer: ${item.correctText}</span>
                </div>
              `;
            }

            reviewContainer.appendChild(reviewItem);
          });
        } catch (err) {
          console.error(err);
          reviewContainer.innerHTML = `<p class="empty-state">Couldn't load answer review.</p>`;
        }
      }

      function closeModal() {
        quizModalOverlay.classList.remove("show");
        if (lastFocusedRow) {
          lastFocusedRow.focus();
        }
      }

      modalCloseBtn.addEventListener("click", closeModal);
      quizModalOverlay.addEventListener("click", (event) => {
        if (event.target === quizModalOverlay) {
          closeModal();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          quizModalOverlay.classList.contains("show")
        ) {
          closeModal();
        }
      });

      document
        .getElementById("backToDashboardBtn")
        .addEventListener("click", () => {
          window.location.href = "student-dashboard.html";
        });

      fetchResults();

      function loadName() {
        const data = {
          name: localStorage.getItem("userName"),
          role: localStorage.getItem("role"),
        };

        if (!data) {
          userName.textContent = "Loading . . .";
          role.textContent = "";
          userAvatar.textContent = "T";
          return;
        }

        userName.textContent = data["name"];
        role.textContent = data["role"];

        userAvatar.textContent = data["name"].split(" ")[0][0];
      }

      const logoutModalOverlay = document.getElementById("logoutModalOverlay");

      document
        .getElementById("logoutBtnStudent")
        .addEventListener("click", function () {
          logoutModalOverlay.classList.add("show");
        });

      logoutModalOverlay.addEventListener("click", function (e) {
        if (e.target.id === "cancelLogoutBtn") {
          logoutModalOverlay.classList.remove("show");
          return;
        }
        if (e.target.id === "confirmLogoutBtn") {
          localStorage.removeItem("token");
          localStorage.removeItem("userName");
          localStorage.removeItem("role");
          window.location.href = "index.html";
          return;
        }

        return;
      });
    </script>
  </body>
</html>
